spring.application.name=Tier-3

# gRPC server that Tier 2 connects to
spring.grpc.server.port=9090

# PostgreSQL database
spring.datasource.url=jdbc:postgresql://localhost:5432/drivia
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
# Make password invisible to git

# Tables come from database/init.sql, Hibernate only checks that they match the entities
spring.jpa.hibernate.ddl-auto=validate
