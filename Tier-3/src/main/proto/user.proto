syntax = "proto3";

package drivia;

option java_multiple_files = true;
option java_package = "dk.via.sep3.drivia.grpc";

service UserService {
  rpc Register (RegisterRequest) returns (User);   // PB-04 register as customer
  rpc Login (LoginRequest) returns (User);         // PB-05, PB-06 log in
  rpc GetUser (UserIdRequest) returns (User);
}

// role is "CUSTOMER" or "EMPLOYEE". The password is never sent back.
message User { int32 id = 1; string name = 2; string email = 3; string role = 4; }

message RegisterRequest { string name = 1; string email = 2; string password = 3; string phone_number = 4; }
message LoginRequest { string email = 1; string password = 2; }
message UserIdRequest { int32 id = 1; }
