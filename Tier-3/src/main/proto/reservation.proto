syntax = "proto3";

package drivia;

option java_multiple_files = true;
option java_package = "dk.via.sep3.drivia.grpc";

service ReservationService {
  rpc CreateReservation (CreateReservationRequest) returns (Reservation);        // PB-18, PB-19
  rpc GetReservation (ReservationIdRequest) returns (Reservation);
  rpc GetAllReservations (GetAllReservationsRequest) returns (ReservationList);  // PB-21 employee
  rpc GetCustomerReservations (CustomerIdRequest) returns (ReservationList);     // PB-20 customer
  rpc ModifyReservation (ModifyReservationRequest) returns (Reservation);        // PB-24
  rpc CancelReservation (ReservationIdRequest) returns (Reservation);            // PB-25
  rpc ApproveReservation (ReservationIdRequest) returns (Reservation);           // PB-21
  rpc PickupReservation (ReservationIdRequest) returns (Reservation);            // PB-22
  rpc ReturnReservation (ReservationIdRequest) returns (Reservation);            // PB-23
}

// Dates are strings in the format yyyy-MM-dd
message Reservation {
  int32 id = 1; int32 customer_id = 2; int32 vehicle_id = 3; string vehicle_model = 4;
  int32 location_id = 5; string location_name = 6; string pickup_date = 7; string return_date = 8;
  string status = 9; int32 total_price = 10;
}

message CreateReservationRequest { int32 customer_id = 1; int32 vehicle_id = 2; string pickup_date = 3; string return_date = 4; }
message ModifyReservationRequest { int32 id = 1; int32 vehicle_id = 2; string pickup_date = 3; string return_date = 4; }
message ReservationIdRequest { int32 id = 1; }
message CustomerIdRequest { int32 customer_id = 1; }
message GetAllReservationsRequest {}
message ReservationList { repeated Reservation reservations = 1; }